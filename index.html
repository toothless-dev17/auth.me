<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="toothless.dev">
    <meta name="copyright" content="toothless. All rights reserved.">
    <meta name="description" content="Secure server authentication portal for Lazmedia Crew. Access your protected resources with confidence.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#06b6d4">
    <title>Secure Login | Lazmedia Server Authentication</title>
    <link rel="icon" type="image/png" href="Assets/Logo-matrix-a.png">
    <link rel="stylesheet" href="CSS/index-styles.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>
</head>

<body>
    <header>
        <div class="site-header">
            <div class="header-content">
                <img src="Assets/Logo-matrix-a.png" class="site-logo" alt="Lazmedia Logo">
                <span class="site-title">Secure Server Portal - Lazmedia Crew</span>
            </div>
        </div>
    </header>

    <main>
        <div class="login-container">
            <div class="login-card">
                <h2 class="login-title">Welcome Back</h2>
                <p class="login-subtitle">Sign in to access your secure server dashboard</p>
                <form class="login-form" id="authForm">
                    <div class="form-group">
                        <label for="username">Email Address</label>
                        <input type="email" id="username" name="username" placeholder="Enter your email address" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="login-btn">Sign In Securely</button>
                    <div class="form-footer">
                        <a href="#" id="forgotPassword" class="forgot-password">Forgot your password?</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Initialize Firebase and our app -->
    <script src="JS/firebase.js"></script>
    <script src="JS/index.js"></script>
</body>

</html>
